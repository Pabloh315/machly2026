services:
  machly:
    build:
      context: .
      dockerfile: Dockerfile
    image: machly:2026-local
    container_name: machly-server
    restart: unless-stopped
    ports:
      - "${MACHLY_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/machly.db
      JWT_SECRET: "${JWT_SECRET:-cambia-esta-clave-antes-de-usar-machly}"
    volumes:
      - machly_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  machly_data:
    name: machly_data
